<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050508">
  <title>Для тебя ❤️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #180512 0%, #070208 60%, #000000 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      touch-action: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Floating UI overlay */
    .ui-container {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 30px);
      pointer-events: none;
    }

    .header-text {
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 182, 193, 0.7);
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
      animation: fadeInDown 1.5s ease-out;
      margin-top: 10px;
    }

    .message-box {
      text-align: center;
      margin-bottom: 25px;
      pointer-events: auto;
      cursor: pointer;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 192, 203, 0.15);
      border-radius: 30px;
      box-shadow: 0 8px 32px rgba(255, 20, 147, 0.15);
      transition: all 0.3s ease;
      animation: pulseGlow 3s infinite alternate;
    }

    .message-box:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.1);
    }

    .main-text {
      font-size: 22px;
      font-weight: 600;
      background: linear-gradient(135deg, #fff0f5 0%, #ff69b4 50%, #ff1493 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .hint-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.5px;
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 15px rgba(255, 20, 147, 0.2);
        border-color: rgba(255, 192, 203, 0.15);
      }
      100% {
        box-shadow: 0 0 30px rgba(255, 20, 147, 0.45);
        border-color: rgba(255, 105, 180, 0.4);
      }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <div class="ui-container">
    <div class="header-text">ДЛЯ ТЕБЯ ❤️</div>
    
    <div class="message-box" id="msgBox" onclick="triggerBurstCenter()">
      <div class="main-text" id="textTitle">Ты в моем сердце</div>
      <div class="hint-text">Коснись экрана в любом месте ✨</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let dpr = 1;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio Synthesizer for gentle romantic heartbeat sound
    let audioCtx = null;
    function playHeartSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
      } catch (e) {}
    }

    // Parametric heart formula
    function heartPosition(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x: x * scale, y: y * scale };
    }

    // Main particle cloud
    const HEART_PARTICLE_COUNT = 1200;
    const particles = [];
    const colors = [
      '#ff1493', '#ff69b4', '#ff77a9', '#ff007f', 
      '#e0115f', '#ffb6c1', '#ffffff', '#ff3366'
    ];

    class HeartParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.t = Math.PI * 2 * Math.random();
        this.scaleTarget = 8 + Math.random() * 5.5;
        this.depth = (Math.random() - 0.5) * 80;
        
        // Random spread inside the heart shape
        const spread = Math.pow(Math.random(), 0.7);
        this.basePos = heartPosition(this.t, this.scaleTarget * spread);
        
        this.x = this.basePos.x;
        this.y = this.basePos.y;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.size = Math.random() * 2.2 + 0.8;
        this.alpha = Math.random() * 0.7 + 0.3;
        this.speed = Math.random() * 0.02 + 0.01;
        this.phase = Math.random() * Math.PI * 2;
      }

      update(beatScale, time) {
        const floatX = Math.sin(time * 2 + this.phase) * 2;
        const floatY = Math.cos(time * 2 + this.phase) * 2;
        
        this.x = (this.basePos.x + floatX) * beatScale;
        this.y = (this.basePos.y + floatY) * beatScale;
        
        // Twinkle
        this.currentAlpha = this.alpha * (0.8 + 0.2 * Math.sin(time * 4 + this.phase));
      }

      draw(cx, cy) {
        ctx.save();
        ctx.globalAlpha = this.currentAlpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        
        ctx.beginPath();
        ctx.arc(cx + this.x, cy + this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < HEART_PARTICLE_COUNT; i++) {
      particles.push(new HeartParticle());
    }

    // Sparkles and flying mini-hearts for touch bursts
    const sparkles = [];

    class Sparkle {
      constructor(x, y, isHeart = false) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 2;
        this.gravity = 0.08;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.size = isHeart ? (Math.random() * 12 + 10) : (Math.random() * 4 + 2);
        this.isHeart = isHeart;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.rotation = Math.random() * Math.PI;
        this.rotSpeed = (Math.random() - 0.5) * 0.1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.98;
        this.rotation += this.rotSpeed;
        this.life -= this.decay;
      }

      draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (this.isHeart) {
          ctx.font = `${this.size}px -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('❤️', 0, 0);
        } else {
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = this.color;
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function createBurst(x, y, count = 25) {
      playHeartSound();
      if (navigator.vibrate) {
        navigator.vibrate(35);
      }
      for (let i = 0; i < count; i++) {
        sparkles.push(new Sparkle(x, y, Math.random() > 0.4));
      }
    }

    function triggerBurstCenter() {
      createBurst(width / 2, height / 2 - 20, 35);
    }

    // Touch and mouse listeners
    window.addEventListener('pointerdown', (e) => {
      createBurst(e.clientX, e.clientY, 20);
    });

    let time = 0;
    function animate() {
      time += 0.025;
      
      // Clear with soft decay for gorgeous glowing motion blur
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(7, 2, 8, 0.22)';
      ctx.fillRect(0, 0, width, height);

      // Heartbeat pulse calculation (lub-dub)
      const beat = Math.sin(time * 3);
      const beat2 = Math.sin(time * 3 + 0.4);
      let pulse = 1;
      if (beat > 0.6) {
        pulse += Math.pow((beat - 0.6) / 0.4, 2) * 0.16;
      } else if (beat2 > 0.7) {
        pulse += Math.pow((beat2 - 0.7) / 0.3, 2) * 0.08;
      }

      // Responsive center point
      const cx = width / 2;
      const cy = height / 2 - 30;

      // Draw subtle background aura
      const radialGradient = ctx.createRadialGradient(cx, cy, 20, cx, cy, 180 * pulse);
      radialGradient.addColorStop(0, 'rgba(255, 20, 147, 0.28)');
      radialGradient.addColorStop(0.5, 'rgba(255, 105, 180, 0.08)');
      radialGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = radialGradient;
      ctx.beginPath();
      ctx.arc(cx, cy, 200 * pulse, 0, Math.PI * 2);
      ctx.fill();

      // Render glowing heart particles with lighter blend mode
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < particles.length; i++) {
        particles[i].update(pulse, time);
        particles[i].draw(cx, cy);
      }

      // Update and render interactive sparkles
      for (let i = sparkles.length - 1; i >= 0; i--) {
        sparkles[i].update();
        sparkles[i].draw();
        if (sparkles[i].life <= 0) {
          sparkles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
